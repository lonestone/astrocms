name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the runtime of the published Docker image (node:22-slim)
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test --workspace astrocms

      - name: Build frontend
        run: npm run build --workspace astrocms
