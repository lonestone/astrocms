<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroCMS</title>
    <script>
      // Resolve the theme before first paint to avoid a light/dark flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('cms-theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="font-sans text-ui text-text bg-bg h-screen overflow-hidden antialiased">
    <div id="root" class="h-screen flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
